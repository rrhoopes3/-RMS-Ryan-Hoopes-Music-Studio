name: Desktop builds

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libjack-jackd2-0
      - name: Test shared model and portable audio engine
        run: dotnet test tests/RyanMusicStudio.Tests/RyanMusicStudio.Tests.csproj -f net8.0 -c Release
      - name: Build macOS packages
        if: runner.os == 'macOS'
        run: |
          RID=osx-arm64 scripts/build-desktop.sh
          RID=osx-x64 scripts/build-desktop.sh
      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          RID=linux-x64 scripts/build-desktop.sh
          RID=linux-arm64 scripts/build-desktop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RMS-${{ runner.os }}
          path: |
            dist/RMS-*.zip
            dist/RMS-*.tar.gz
          if-no-files-found: error

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test original Windows app
        run: dotnet test tests/RyanMusicStudio.Tests/RyanMusicStudio.Tests.csproj -f net8.0-windows -c Release
      - name: Check Windows layouts and capture screens
        run: dotnet run --project tests/RyanMusicStudio.UiSmoke/RyanMusicStudio.UiSmoke.csproj -c Release -- dist/windows-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RMS-Windows-screens
          path: dist/windows-ui/*.png
          if-no-files-found: warn
      - name: Publish Windows portable app
        run: >-
          dotnet publish src/RyanMusicStudio.App/RyanMusicStudio.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist/RMS-portable
      - uses: actions/upload-artifact@v4
        with:
          name: RMS-Windows
          path: dist/RMS-portable/RMS.exe
          if-no-files-found: error
